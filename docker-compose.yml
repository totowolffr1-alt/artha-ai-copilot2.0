version: "3.8"

services:
  # ── Artha AI Backend API ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: artha-api
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DEMO_MODE=${DEMO_MODE:-false}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SMARTAPI_CLIENT_ID=${SMARTAPI_CLIENT_ID}
      - SMARTAPI_PASSWORD=${SMARTAPI_PASSWORD}
      - SMARTAPI_API_KEY=${SMARTAPI_API_KEY}
      - SMARTAPI_TOTP_SECRET=${SMARTAPI_TOTP_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
    volumes:
      - artha_dbdata:/app/apps/api/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Artha AI Web Copilot Frontend ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: artha-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── TimescaleDB Historical Bar Store (Optional) ────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: artha-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: artha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artha_prod_secure_pass}
      POSTGRES_DB: artha
    ports:
      - "5432:5432"
    volumes:
      - artha_pgdata:/var/lib/postgresql/data

volumes:
  artha_dbdata:
  artha_pgdata:
